:root{
  color-scheme: light;
  --ink:#1c1936; --ink-2:#4e4b66; --ink-3:#7c7993; --paper:#f5f5f8; --surface:#fff; --line:#e3e2ec; --line-2:#efeef4; --hover:#f7f6fb;
  --brand:#4a33b3; --brand-ink:#3a2799; --brand-soft:#efecfb; --brand-line:#d9d2f5;
  --ok:#11765f; --ok-soft:#e5f3ee; --watch:#9a6400; --watch-soft:#fbf1dc; --crit:#c2462d; --crit-soft:#fcebe5; --breach:#a8201a; --breach-soft:#fde6e4;
  --info:#2f5f9e; --info-soft:#e7eef8; --neutral:#6b6880; --neutral-soft:#efeef4;
  --c1:#4a33b3; --c2:#8f80dc; --c3:#2b8a7e; --c4:#c39a2f; --c5:#b45a86; --c6:#5679b3; --c7:#9b98ae;
  --r-sm:6px; --r:10px; --r-lg:14px; --shadow:0 1px 2px rgba(28,25,54,.05),0 4px 16px rgba(28,25,54,.04);
  --font:Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.num,.tnum,td.num,th.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:26px;line-height:1.2}
h2{font-size:18px;line-height:1.3}
h3{font-size:15px;line-height:1.35}
p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:12.5px} .xs{font-size:11.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand-name{font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand-sub{font-size:11.5px;color:var(--ink-3);line-height:1.2}
.nav-group{margin:6px 0 12px}
.nav-label{font-size:12px;color:var(--ink-3);padding:6px 10px 4px;font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--hover);text-decoration:none;color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-ink)}
.nav a.on svg{color:var(--brand)}
.nav svg{width:17px;height:17px;flex:none;color:var(--ink-3)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line-2);display:grid;gap:8px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--neutral-soft);border-radius:999px;padding:3px 10px;width:max-content}
.demo-tag i{width:6px;height:6px;border-radius:50%;background:var(--brand);display:inline-block}
.main-col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(245,245,248,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 28px;min-height:58px;flex-wrap:wrap}
.icon-btn.menu-btn{display:none}
.top-spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.pill b{color:var(--ink);font-weight:600}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.scope{position:relative}
.scope-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.scope-btn:hover{border-color:var(--brand-line)}
.scope-pop{position:absolute;top:calc(100% + 6px);left:0;width:330px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(28,25,54,.14);padding:12px;z-index:40}
.scope-pop label{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:6px;cursor:pointer}
.scope-pop label:hover{background:var(--hover)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.chip:hover{border-color:var(--brand-line);color:var(--ink)}
.chip.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-ink);font-weight:600}
.content{padding:26px 28px 64px;max-width:1280px;width:100%}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph p{margin-top:6px;color:var(--ink-2);max-width:72ch}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- buttons & form ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;font-weight:550;font-size:13.5px;cursor:pointer;text-decoration:none!important;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:#cfcde0;background:var(--hover)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-ink)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--breach)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;font-weight:550;text-align:left}
.link:hover{text-decoration:underline}
.field{display:grid;gap:5px}
.field>span{font-size:12.5px;color:var(--ink-2);font-weight:550}
.field small{color:var(--ink-3);font-size:11.5px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-height:36px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:2px solid var(--brand-line);border-color:var(--brand)}
.input-affix{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.input-affix .input{border:0;border-radius:0;outline:0}
.input-affix em{font-style:normal;color:var(--ink-3);padding:0 10px;font-size:13px}
.input-affix:focus-within{outline:2px solid var(--brand-line);border-color:var(--brand)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form-grid .full{grid-column:1/-1}
input[type=range]{width:100%;accent-color:var(--brand)}
.err{color:var(--breach);font-size:12.5px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 0}
.card-b{padding:16px 18px}
.card-f{padding:12px 18px;border-top:1px solid var(--line-2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.stack{display:grid;gap:16px}
.grid>*,.stack>*,.scen-grid>*,.kpis>*{min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.sep{height:1px;background:var(--line-2);margin:14px 0}
.note{background:var(--neutral-soft);border-radius:var(--r);padding:10px 12px;color:var(--ink-2);font-size:12.5px}
.note.brand{background:var(--brand-soft);color:var(--brand-ink)}
.note.watch{background:var(--watch-soft);color:#6f4800}
.note.crit{background:var(--crit-soft);color:#8a2c1a}
.callout{border-left:3px solid var(--brand);padding:2px 0 2px 12px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;text-align:left;cursor:pointer;display:grid;gap:3px;transition:border-color .15s}
.kpi:hover{border-color:var(--brand-line)}
.kpi .k{font-size:12.5px;color:var(--ink-2);font-weight:550}
.kpi .v{font-size:23px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.kpi .src{font-size:11.5px;color:var(--brand);margin-top:4px}

/* ---------- status ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.5}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-watch{background:var(--watch-soft);color:var(--watch)} .b-crit{background:var(--crit-soft);color:var(--crit)}
.b-breach{background:var(--breach-soft);color:var(--breach)} .b-info{background:var(--info-soft);color:var(--info)} .b-neutral{background:var(--neutral-soft);color:var(--neutral)} .b-brand{background:var(--brand-soft);color:var(--brand-ink)}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--ink-2);background:var(--surface);white-space:nowrap}
.tag.proj{border-style:dashed;color:var(--info);border-color:#b9cbe6}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{font-weight:550;color:var(--ink-3);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .num{text-align:right;white-space:nowrap}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--hover)}
.t tfoot td{border-top:1px solid var(--line);font-weight:650;border-bottom:0}
.t tr.hl td{background:#fff8e1}
.t .sub{display:block;font-size:12px;color:var(--ink-3)}
.t td.strong{font-weight:600}

/* ---------- charts ---------- */
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(110px,170px) 1fr 76px;gap:10px;align-items:center;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar-track{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:5px}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stackbar{display:flex;height:44px;border-radius:9px;overflow:hidden;gap:2px;background:var(--line-2)}
.stackbar>div{display:flex;align-items:center;padding:0 10px;color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0;cursor:pointer;transition:filter .15s}
.stackbar>div:hover{filter:brightness(1.08)}
.stackbar>.undrawn{background:repeating-linear-gradient(135deg,#efecfb 0 6px,#e2dcf7 6px 12px)!important;color:var(--brand-ink);border:1px dashed var(--brand-line)}
.capband{display:grid;gap:10px}
.capband-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}
svg.chart text{font-family:var(--font);fill:var(--ink-3);font-size:11px}
svg.chart .v{fill:var(--ink-2);font-weight:600}
.progress{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--brand);border-radius:4px}

/* ---------- lists ---------- */
.pri{display:grid;grid-template-columns:4px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.pri:last-child{border-bottom:0}
.pri .rail{border-radius:2px}
.pri h3{font-size:14.5px}
.pri p{color:var(--ink-2);font-size:13px;margin-top:3px}
.pri .actions{margin-top:9px}
.pipe{display:grid;gap:10px}
.pipe a{display:grid;gap:4px;padding:12px;border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink)}
.linkcard{display:block;padding:12px;border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink)}
.linkcard:hover{border-color:var(--brand-line);text-decoration:none;background:var(--hover)}
.pipe a:hover{border-color:var(--brand-line);text-decoration:none;background:var(--hover)}
.stage-track{display:flex;gap:3px}
.stage-track i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.stage-track i.on{background:var(--brand)}
.dl{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:8px 14px;font-size:13.5px}
.dl dt{color:var(--ink-3)} .dl dd{margin:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:9px 13px;color:var(--ink-2);font-weight:550;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink);text-decoration:none}
.tabs a.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
.tabs a .count{font-size:11.5px;background:var(--neutral-soft);border-radius:999px;padding:0 6px;margin-left:5px;color:var(--ink-2)}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;counter-reset:s}
.stepper div{font-size:12px;color:var(--ink-3);border-top:3px solid var(--line);padding-top:7px;line-height:1.3}
.stepper div.done{border-color:var(--brand-line);color:var(--ink-2)}
.stepper div.cur{border-color:var(--brand);color:var(--brand-ink);font-weight:650}
.empty{text-align:center;padding:36px 18px;color:var(--ink-2)}
.empty h3{margin-bottom:6px;color:var(--ink)}
.flag{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.flag:last-child{border-bottom:0}
.flag svg{width:16px;height:16px;margin-top:2px}
.check{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.check:last-child{border-bottom:0}
.match{display:inline-flex;gap:3px}
.match i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.match i.on{background:var(--ok)}
.crit-list{display:grid;gap:5px;font-size:12.5px}
.crit-list div{display:grid;grid-template-columns:16px 110px 1fr;gap:6px;align-items:start}
.crit-list svg{width:14px;height:14px;margin-top:2px}

/* ---------- tree / provenance ---------- */
.tree{display:grid;gap:2px}
.tree-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:8px 10px;border-radius:8px;align-items:center;cursor:pointer;border:1px solid transparent}
.tree-row:hover{background:var(--hover);border-color:var(--line-2)}
.tree-row .lbl{display:flex;gap:8px;align-items:baseline;min-width:0}
.tree-row .sg{color:var(--ink-3);width:12px;flex:none;text-align:center}
.tree-row .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.tree-kids{margin-left:20px;border-left:1px solid var(--line);padding-left:6px}
.drawer-back{position:fixed;inset:0;background:rgba(28,25,54,.28);z-index:60;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);z-index:61;box-shadow:-12px 0 40px rgba(28,25,54,.16);display:flex;flex-direction:column;animation:slide .18s ease-out}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.drawer-b{padding:18px 20px;overflow-y:auto;flex:1}
.prov-val{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;word-break:break-word;line-height:1.55}
.excerpt{border-left:3px solid var(--brand);background:var(--brand-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-back{position:fixed;inset:0;background:rgba(28,25,54,.35);z-index:70;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(620px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(28,25,54,.25)}
.modal.wide{width:min(900px,100%)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.icon-btn{border:0;background:transparent;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;z-index:80;box-shadow:0 12px 30px rgba(28,25,54,.3);max-width:min(520px,calc(100% - 32px));animation:fade .2s;display:flex;gap:12px;align-items:flex-start}
.toast p{font-size:12.5px;color:#cfcce4;margin-top:2px}
.docpage{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px 32px;box-shadow:var(--shadow);font-size:14px;line-height:1.65;max-width:720px}
.docpage .rh{font-size:11.5px;color:var(--ink-3);border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:16px;display:flex;justify-content:space-between}
.docpage .blk{padding:4px 8px;margin:0 -8px 8px;border-radius:6px}
.docpage .blk.title{font-size:20px;font-weight:650}
.docpage .blk.h{font-weight:650;margin-top:14px}
.docpage .blk.hl{background:#fff3c4;box-shadow:inset 3px 0 0 #e0b400}
.compare th{min-width:150px}
.compare td{min-width:180px}
.compare tr.grp td{background:var(--paper);font-weight:650;color:var(--ink-2);font-size:12px}
.scen-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
.scen-form{position:sticky;top:76px}
.delta-up{color:var(--ok)} .delta-down{color:var(--crit)}
.cmp-table td.num{width:140px}
.vision-layer{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line-2)}
.vision-layer:last-child{border-bottom:0}
.vision-n{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--brand-soft);color:var(--brand-ink)}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}.scen-grid{grid-template-columns:1fr}.scen-form{position:static}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(28,25,54,.2)}
  .app.nav-open .side{transform:none}
  .icon-btn.menu-btn{display:grid}
  .top{padding:10px 16px}
  .content{padding:20px 16px 56px}
  .g2,.g3{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:20px}h1{font-size:22px}.hide-sm{display:none}.stepper{grid-template-columns:repeat(3,minmax(0,1fr))}.bar-row{grid-template-columns:96px 1fr 64px}.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.top,.no-print{display:none!important}.app{display:block}.content{padding:0}}

/* =========================================================================
   FORMAT — consistent English formatting (en-GB dates, comma thousands)
   ========================================================================= */
const CURRENCY_SYMBOL = { EUR: "€", GBP: "£" };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MINUS = "−";
const Fmt = {
  group(intStr) { return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, ","); },
  num(cents, dp = 2) { // cents -> "9,400,000.00"
    if (cents === null || cents === undefined) return "—";
    const neg = cents < 0; const v = Math.abs(cents) / 100; const s = v.toFixed(dp); const [a, b] = s.split(".");
    const out = `${Fmt.group(a)}${b ? "." + b : ""}`; return neg && parseFloat(s) !== 0 ? MINUS + out : out;
  },
  money(cents, currency = "EUR", dp = 0) {
    if (cents === null || cents === undefined) return "—";
    const sym = CURRENCY_SYMBOL[currency] || currency + " "; const neg = cents < 0;
    return `${neg ? MINUS : ""}${sym}${Fmt.num(Math.abs(cents), dp)}`;
  },
  compact(cents, currency = "EUR") {
    if (cents === null || cents === undefined) return "—";
    const sym = CURRENCY_SYMBOL[currency] || currency + " "; const neg = cents < 0; const v = Math.abs(cents) / 100;
    let s;
    if (v >= 999500) { const m = v / 1e6; s = (m >= 10 ? m.toFixed(1) : m.toFixed(2)).replace(/0+$/, "").replace(/\.$/, "") + "m"; }
    else if (v >= 1e3) s = `${Math.round(v / 1e3)}k`; else s = `${Math.round(v)}`;
    return `${neg ? MINUS : ""}${sym}${s}`;
  },
  signedMoney(cents, currency = "EUR") { if (cents === null) return "—"; if (cents === 0) return Fmt.money(0, currency); return (cents > 0 ? "+" : MINUS) + Fmt.money(Math.abs(cents), currency); },
  signedCompact(cents, currency = "EUR") { if (cents === null) return "—"; if (Math.abs(cents) < 50) return Fmt.compact(0, currency); return (cents > 0 ? "+" : MINUS) + Fmt.compact(Math.abs(cents), currency); },
  ratio(v, dp = 2) { if (v === null || v === undefined || v === "") return "—"; const n = typeof v === "string" ? parseFloat(v) : v; return `${n.toFixed(dp)}x`; },
  pct(frac, dp = 1) { if (frac === null || frac === undefined || !isFinite(frac)) return "—"; const s = (frac * 100).toFixed(dp); return `${s.startsWith("-") ? MINUS + s.slice(1) : s}%`; },
  signedPct(frac, dp = 1) { if (frac === null || frac === undefined) return "—"; const s = (Math.abs(frac) * 100).toFixed(dp); return `${frac > 0 ? "+" : frac < 0 ? MINUS : ""}${s}%`; },
  bp(bp, dp = 2) { if (bp === null || bp === undefined) return "—"; return `${(bp / 100).toFixed(dp)}%`; },
  date(d) { if (!d) return "—"; const [y, m, dd] = d.slice(0, 10).split("-"); return `${parseInt(dd, 10)} ${MONTHS[parseInt(m, 10) - 1]} ${y}`; },
  monthYear(d) { const [y, m] = d.split("-"); return `${MONTHS[parseInt(m, 10) - 1]} ${y}`; },
  dateTime(dt) { if (!dt) return "—"; return `${Fmt.date(dt)}, ${dt.slice(11, 16)}`; },
  cmp(c) { return { LTE: "≤", LT: "<", GTE: "≥", GT: ">" }[c]; },
  months(n) { return n === 1 ? "1 month" : `${n} months`; }
};

/* =========================================================================
   ENGINE — deterministic calculations (no UI, no state)
   Money is handled as integer cents. Ratios are compared with integer maths.
   Ported from the Covenn BETA engine: account mapping, LTM construction,
   covenant evaluation, status bands, provenance trees, canonical inputs + SHA-256.
   ========================================================================= */

const Money = {
  parse(str) { // "1234.5" | "-12.30" -> cents
    if (str === null || str === undefined || str === "") return null;
    const s = String(str).trim(); const neg = s.startsWith("-"); const [a, b = ""] = s.replace("-", "").split(".");
    const v = parseInt(a || "0", 10) * 100 + parseInt((b + "00").slice(0, 2), 10);
    return neg ? -v : v;
  },
  str(c) { // cents -> "1234.50"
    const neg = c < 0; const a = Math.abs(c); return `${neg ? "-" : ""}${Math.floor(a / 100)}.${String(a % 100).padStart(2, "0")}`;
  },
  divRound(a, b) { // integer division rounded half away from zero
    const sign = (a < 0) !== (b < 0) ? -1 : 1; const A = Math.abs(a), B = Math.abs(b);
    return sign * Math.floor((2 * A + B) / (2 * B));
  },
  fx(cents, currency) { // to reporting currency (EUR)
    if (currency === "EUR") return cents;
    const r = Math.round(parseFloat(FX.rates[currency]) * 10000);
    return Money.divRound(cents * r, 10000);
  },
  pct(cents, bp) { return Money.divRound(cents * bp, 10000); }
};

const DateX = {
  parts(d) { const [y, m, dd] = d.split("-").map(Number); return { y, m, d: dd }; },
  dim(y, m) { return m === 2 ? ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0 ? 29 : 28) : [4, 6, 9, 11].includes(m) ? 30 : 31; },
  fmt({ y, m, d }) { return `${String(y).padStart(4, "0")}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`; },
  isEom(d) { const p = DateX.parts(d); return p.d === DateX.dim(p.y, p.m); },
  addMonths(d, n) {
    const p = DateX.parts(d); const i = p.y * 12 + (p.m - 1) + n; const y = Math.floor(i / 12), m = (i % 12) + 1; const last = DateX.dim(y, m);
    return DateX.fmt({ y, m, d: DateX.isEom(d) ? last : Math.min(p.d, last) });
  },
  year(d) { return DateX.parts(d).y; },
  fyEnd(y, m, d) { return DateX.fmt({ y, m, d: Math.min(d, DateX.dim(y, m)) }); },
  monthsBetween(a, b) { const A = DateX.parts(a), B = DateX.parts(b); return (B.y - A.y) * 12 + (B.m - A.m) + (B.d >= A.d ? 0 : -1); }
};

  const mapping = activeMapping(ds, entity.id);

  if (short.length) flags.push({ level: "WATCH", text: `Repayments and transaction flows within the horizon exceed cash on hand at ${short.map(e => `${e.short_name} (${Fmt.compact(cash[e.id])})`).join(", ")}, before operating cash flow, which is not modelled.` });

  for (const c of covenants) if (c.status && c.status !== "COMPLIANT") flags.push({ level: c.status, text: `Projected ${c.label.toLowerCase()} of ${Fmt.ratio(c.value)} against ${Fmt.cmp(c.comparison)} ${Fmt.ratio(c.threshold)} at ${Fmt.date(H)} (${c.statusText}).`, covenant: c.id });
  const profileStart = maturityProfile(fac.map(x => ({ maturity: x.f.maturity_date, eur: x.start })));
  const profileEnd = maturityProfile([...fac.filter(x => x.end > 0).map(x => ({ maturity: x.f.maturity_date, eur: x.end })), ...(newFac && newFac.outstanding ? [{ maturity: newFac.maturity, eur: newFac.outstanding }] : [])]);

}

const STATUS_TEXT = { COMPLIANT: "compliant", WATCH: "watch", CRITICAL: "critical headroom", BREACH: "breach", NOT_MEANINGFUL: "not meaningful", NOT_COMPUTABLE: "not computable" };
function projectCovenants(ds, sc, ctx) {
  const base = id => runCovenant(ds, id, DEMO.asOf);
  const lev = base("cov-lev"), gea = base("cov-gea"), icr = base("cov-icr");
  const sfa = ctx.fac.find(x => x.f.id === "fin-01"); const atBorrower = ctx.actor && ctx.actor.id === "ent-di";
  const principal = (sfa ? sfa.end : 0) + (atBorrower ? ctx.B : 0); const borrowerCash = ctx.cash["ent-di"];
  const nfi = principal - borrowerCash;
  const grow = v => Money.divRound(v * (100 + ctx.g) * 100, 10000);
  const borrowerInterest = ctx.fac.filter(x => x.f.entity_id === "ent-di").reduce((s, x) => s + x.interestEnd, 0) + (atBorrower && ctx.newFac ? ctx.newFac.interest : 0);
  const mk = (calc, label, num, den, numNote, denNote) => {
    const def = calc.definition; if (!calc.result || calc.result.status === "NOT_COMPUTABLE") return { id: calc.covenant.id, label, status: null, unavailable: "Current calculation is incomplete" };
    const step = thresholdAt(def, ctx.H).current; const thr100 = Math.round(parseFloat(step.threshold) * 100);
    if (den <= 0) return { id: calc.covenant.id, label, status: "NOT_MEANINGFUL", statusText: STATUS_TEXT.NOT_MEANINGFUL, threshold: step.threshold, comparison: def.comparison, numerator: num, denominator: den };
    const value = num / den; const status = ratioStatus(num, den, thr100, def.comparison); const T = thr100 * den, N = num * 100; const hp = (isLower(def.comparison) ? T - N : N - T) / T;
    const currentValue = calc.result.value ? parseFloat(calc.result.value) : null;
    const res = { id: calc.covenant.id, label, value, currentValue, currentThreshold: calc.result.threshold, threshold: step.threshold, thresholdFrom: step.from_date, comparison: def.comparison, status, statusText: STATUS_TEXT[status], headroomPct: hp, numerator: num, denominator: den, numNote, denNote };
    if (calc.covenant.id === "cov-lev") { res.requiredDenominator = Money.divRound(num * 100, thr100); res.requiredNumeratorCut = Math.max(0, num - Money.divRound(thr100 * den, 100)); }
    return res;
  };
  const levDen = lev.result && lev.result.denominator !== null ? grow(lev.result.denominator) + (atBorrower ? ctx.inc : 0) : 0;
  const icrNum = icr.result && icr.result.numerator !== null ? grow(icr.result.numerator) + (atBorrower ? ctx.inc : 0) : 0;
  return [
    mk(lev, "Leverage", nfi, levDen, `Facility principal ${Fmt.money(principal)} less Borrower cash ${Fmt.money(borrowerCash)}${atBorrower && ctx.B ? " (new borrowing counted as Borrower debt — conservative)" : ""}`, `Contractual EBITDA at ${Fmt.date(DEMO.asOf)} (${Fmt.money(lev.result ? lev.result.denominator : 0)})${ctx.g ? ` × (1 ${ctx.g >= 0 ? "+" : MINUS} ${Math.abs(ctx.g)}%)` : ""}${atBorrower && ctx.inc ? ` + ${Fmt.money(ctx.inc)} incremental` : ""}`),
    mk(gea, "Gearing", nfi, gea.result ? gea.result.denominator : 0, "Same net financial indebtedness as leverage", "Book equity held at its 30 Sep 2026 value"),
    mk(icr, "Interest cover", icrNum, borrowerInterest, "Contractual EBITDA, projected as for leverage", `Run-rate interest on the Borrower's facilities at the horizon (${Fmt.money(borrowerInterest)})`)
  ];
}
const SCENARIO_SIMPLIFICATIONS = [
  "Transactions are assumed to close at the start of the horizon; results are shown at the horizon end date.",
  "Operating cash flow, tax and interest payments are not modelled: cash moves only with transaction flows, scheduled repayments and maturities.",
  "Facilities maturing within the horizon are repaid from cash and their commitments lapse unless the scenario refinances them.",

/* ---------- Financing workspace ---------- */
const stageIndex = id => STAGES.findIndex(s => s.id === id);
function completeness(req) {
  const vals = CHECKLIST_TEMPLATE.map(t => req.checklist[t.key] || "MISSING"); const done = vals.filter(v => v === "AVAILABLE" || v === "LINKED").length;
  return { done, total: vals.length, review: vals.filter(v => v === "REVIEW").length, missing: vals.filter(v => v === "MISSING").length, pct: done / vals.length };
}
function requestAmountEur(req) { return Money.fx(Money.parse(req.amount), req.currency); }
function groupEbitdaEur(ds) { return positions(ds, ENTITIES.map(e => e.id)).ebitda.value; }
function matchProvider(ds, p, req) {
  const amt = requestAmountEur(req); const ent = entityOf(req.entity_id); const ge = groupEbitdaEur(ds);
  const instOk = p.instruments.includes(req.instrument) || (req.instrument === "ACQUISITION_FINANCE" && p.instruments.includes("UNITRANCHE"));
  const min = Money.parse(p.ticket_min), max = Money.parse(p.ticket_max), minE = Money.parse(p.min_ebitda);
  const criteria = [
    { key: "instrument", label: "Instrument", ok: instOk, detail: instOk ? `Offers ${INSTRUMENTS[req.instrument].toLowerCase()}${!p.instruments.includes(req.instrument) ? " (via unitranche)" : ""}` : `Does not offer ${INSTRUMENTS[req.instrument].toLowerCase()}` },
    { key: "amount", label: "Amount", ok: amt >= min && amt <= max, detail: `${Fmt.compact(amt)} requested; ticket range ${Fmt.compact(min)}–${Fmt.compact(max)}` },
    { key: "geography", label: "Geography", ok: p.countries.includes(ent.country), detail: `${p.countries.includes(ent.country) ? "Lends" : "Does not lend"} in ${COUNTRIES[ent.country]}` },
    { key: "profile", label: "Borrower profile", ok: ge >= minE, detail: `Group LTM EBITDA ${Fmt.compact(ge)}; typical minimum ${Fmt.compact(minE)}` }
  ];
  return { provider: p, criteria, met: criteria.filter(c => c.ok).length, existing: LENDERS.some(l => l.provider_id === p.id) };
}
function proposalEconomics(p, shift = 0) {
  const A = Money.parse(p.amount); const rate = p.rate_type === "FIXED" ? p.fixed_rate_bp : REFERENCE_RATES.rates[p.reference_rate] + shift + p.margin_bp;
  let bal = A, totalInterest = 0, sumOpening = 0; const years = []; const amortPerYear = p.amortization.kind === "LINEAR_PCT" ? Money.pct(A, p.amortization.pct * 100) : 0;
  for (let y = 1; y <= p.tenor_years; y++) { const interest = Money.pct(bal, rate); totalInterest += interest; sumOpening += bal; const amort = y === p.tenor_years ? bal : Math.min(bal, amortPerYear); years.push({ y, opening: bal, interest, amort }); bal -= amort; }
  const upfront = Money.pct(A, p.upfront_fee_bp); const recurring = Money.parse(p.recurring_fee) || 0; const total = totalInterest + upfront + recurring * p.tenor_years;
  return { A, rate, years, year1Interest: years[0] ? years[0].interest : 0, upfront, recurring, year1Cash: (years[0] ? years[0].interest : 0) + upfront + recurring, totalInterest, total,
    allInPerYear: sumOpening ? total / sumOpening : null, avgLife: A ? sumOpening / A : null, balloon: years.length ? years[years.length - 1].amort : 0 };
}

      actions: [["Review facility", `#/debt/${v.f.id}`], sc ? ["Run refinancing scenario", `#/scenarios/${sc.id}`] : null, req ? ["Open refinancing request", `#/financing/${req.id}`] : ["Prepare refinancing", `action:prepare-refi:${v.f.id}`]].filter(Boolean) });
  }

  if (step && levCalc.result && levCalc.result.value) {
    const base = state.scenarios.find(s => s.id === "sc-base") || SCENARIO_SEEDS[0]; const proj = runScenario(ds, { ...base, horizon_months: Math.max(base.horizon_months, DateX.monthsBetween(DEMO.asOf, step.from_date) + 3) }).covenants.find(c => c.id === "cov-lev");
    out.push({ id: "pri-step-cov-lev", entityId: "ent-di", level: proj && proj.status !== "COMPLIANT" ? proj.status : "WATCH", kind: "Covenant", tag: proj && proj.status !== "COMPLIANT" ? `Projected: ${STATUS_TEXT[proj.status]}` : "Upcoming step-down",
      title: `Leverage threshold steps down to ${Fmt.ratio(step.threshold)} on ${Fmt.date(step.from_date)}`,
      text: `Lumenvale Industrie SAS · SFA-2025-001. Current leverage ${Fmt.ratio(levCalc.result.value)} against ${Fmt.ratio(levCalc.result.threshold)} (${Fmt.pct(levCalc.result.headroomPct)} headroom).${proj && proj.value ? ` At unchanged contractual EBITDA, headroom against the new threshold would be ${Fmt.pct(proj.headroomPct)}.` : ""}`,

  }

    const props = state.proposals.filter(p => p.request_id === req.id); const c = completeness(req);

      text: `${entityOf(req.entity_id).name}. Stage: ${STAGES[stageIndex(req.stage)].label}. ${props.length ? `${props.length} indicative proposal${props.length > 1 ? "s" : ""} received.` : `Preparation ${Math.round(c.pct * 100)}% complete.`}`,

const Storage = {

      if (!s || s.schemaVersion !== DEMO.schemaVersion || !Array.isArray(s.requests) || !Array.isArray(s.scenarios) || !s.scope) return null; return s; } catch { return null; }

  save(state) { if (!state.ui.storageAvailable) return; try { const { ui, ...rest } = state; localStorage.setItem(DEMO.storageKey, JSON.stringify(rest)); } catch { /* quota or privacy mode: keep working in memory */ } },

const Store = {

/* ---------------- Debt & facilities ---------------- */
function scheduleRows(ds, pos, months = 18) {
  const to = DateX.addMonths(DEMO.asOf, months); const rows = [];
  for (const v of pos.facilities) { const s = scheduleFor(v.f, v.local, DEMO.asOf, to, v.rate); for (const e of s.events) rows.push({ date: e.date, v, kind: e.kind === "MATURITY" ? "Maturity" : "Instalment", principal: e.principal, interest: e.interest, estimated: e.estimated, currency: v.f.currency }); }
  for (const c of pos.covenants) { if (!c.def) continue; for (const d of testDates(c.def, DateX.addMonths(DEMO.asOf, 1), to)) rows.push({ date: d, kind: "Covenant test", text: `${c.covenant.short_label} — ${c.entity.short_name}`, href: `#/covenants/${c.covenant.id}` });
    if (c.nextStep && c.nextStep.from_date <= to) rows.push({ date: c.nextStep.from_date, kind: "Threshold step", text: `${c.covenant.short_label} threshold to ${Fmt.ratio(c.nextStep.threshold)}`, href: `#/covenants/${c.covenant.id}` }); }
  const merged = []; for (const r of rows) { if (r.kind === "Covenant test") { const m = merged.find(x => x.kind === r.kind && x.date === r.date); if (m) { m.text += `, ${r.text.split(" — ")[0]}`; continue; } } merged.push(r); }
  return merged.sort((a, b) => a.date.localeCompare(b.date) || a.kind.localeCompare(b.kind));
}

function lifecycleBadge(v) {
  if (!v.calc.result && v.calc.error) return badge("NOT_COMPUTABLE", "No definition");
  if (v.latest && v.modifiedSinceSave) return `<span class="badge b-watch">${icon("lock").replace("<svg", '<svg width="11" height="11"')}Saved · inputs changed since</span>`;
  if (v.latest) return `<span class="badge b-brand">${icon("lock").replace("<svg", '<svg width="11" height="11"')}Saved calculation</span>`;
  return `<span class="badge b-neutral">Current calculation · not saved</span>`;
}

  const results = `<div class="stack">
    <div class="between wrap"><div class="row wrap"><span class="tag proj">Illustrative forecast</span><span class="small muted">Group perimeter · ${Fmt.date(DEMO.asOf)} → ${Fmt.date(r.horizonDate)}</span></div>

    ${r.flags.length ? card("Points to review", r.flags.map(f => `<div class="flag">${flagIcon(f.level)}<div>${esc(f.text)}${f.facility ? ` <a href="#/debt/${f.facility}">Review facility</a>` : ""}${f.covenant ? ` <a href="#/covenants/${f.covenant}">Review covenant</a>` : ""}</div></div>`).join("")) : ""}
    ${card("Today versus scenario", `<div class="tbl-wrap"><table class="t cmp-table"><thead><tr><th>Metric</th><th class="num">Today</th><th class="num">At ${Fmt.date(r.horizonDate)}</th><th class="num">Change</th></tr></thead><tbody>${SC_ROWS.map(([l, k]) => { const a = r.start[k], b = r.end[k]; const d = a === null || b === null ? null : b - a;

      <p class="xs faint mt8">Stocks at the horizon date: debt after scheduled repayments, maturities and refinancing; cash after transaction flows and repayments. Interest is the annual run-rate on debt outstanding at the horizon.</p>`)}

    ${card("Events within the horizon", r.events.length ? r.events.map(e => `<div class="flag">${icon("chev")}<div><b class="tnum">${Fmt.date(e.date)}</b> — ${esc(e.label)}</div></div>`).join("") : '<p class="muted small">No maturity or refinancing within the horizon. Scheduled instalments are included in the figures.</p>')}</div>

    <details class="card"><summary class="card-b" style="cursor:pointer"><b>Assumptions and simplifications</b> <span class="small muted">— what this illustrative model includes and leaves out</span></summary><div class="card-b" style="padding-top:0"><ul class="small muted" style="margin:0;padding-left:18px;display:grid;gap:6px">${SCENARIO_SIMPLIFICATIONS.map(s => `<li>${esc(s)}</li>`).join("")}<li>Reference-rate assumptions: ${Object.entries(REFERENCE_RATES.rates).map(([k, v]) => `${REFERENCE_RATES.labels[k]} ${Fmt.bp(v)}`).join(", ")}.</li></ul></div></details>
  </div>`;
  return `${pageHeader({ title: sc.name, crumbs: [["Forecast & scenarios", "#/scenarios"], [sc.name]], sub: esc(sc.description) })}<div class="scen-grid">${form}${results}</div>`;

/* ---------------- Request detail ---------------- */

  let block = null; if (next) { if (next.id === "SHORTLISTED" && !req.shortlist.length) block = "Shortlist at least one provider first."; if (next.id === "OFFERS" && !props.length) block = "Record at least one indicative proposal first."; if (next.id === "NEGOTIATION") block = "Select a proposal in Terms comparison to move to this stage."; }
  return `<div class="stepper">${STAGES.map((s, k) => `<div class="${k < i ? "done" : k === i ? "cur" : ""}">${esc(s.label)}</div>`).join("")}</div>
  <div class="between wrap mt12"><span class="small muted">Next action: <b style="color:var(--ink)">${esc(req.next_action)}</b></span><div class="actions">${prev ? `<button class="btn sm ghost" data-action="stage" data-id="${req.id}" data-stage="${prev.id}">Back to ${esc(prev.label.toLowerCase())}</button>` : ""}
  ${next ? `<button class="btn sm ${block ? "" : "primary"}" data-action="stage" data-id="${req.id}" data-stage="${next.id}" ${block ? `disabled title="${esc(block)}"` : ""}>Move to: ${esc(next.label)}</button>` : ""}</div></div>${next && block ? `<p class="xs faint" style="text-align:right;margin-top:4px">${esc(block)}</p>` : ""}`;
}
const CHECK_LINKS = { fs: () => "#/data/doc/doc-09", mgmt: () => "#/data/doc/doc-08", debt: () => "#/debt", agreements: r => r.refinance_financing_id ? `#/debt/${r.refinance_financing_id}` : "#/data?tab=documents&type=FACILITY_AGREEMENT", covenants: () => "#/covenants", forecast: r => r.scenario_id ? `#/scenarios/${r.scenario_id}` : "#/scenarios", uop: r => `#/financing/${r.id}`, transaction: () => "#/data?tab=documents&type=TRANSACTION" };

function termsComparison(ds, st, req, props, q) {

  const shift = parseInt(q.shift || "0", 10) || 0; const sc = req.scenario_id ? st.scenarios.find(s => s.id === req.scenario_id) : null; const scr = sc ? runScenario(ds, sc) : null;
  const rows = props.map(p => ({ p, e: proposalEconomics(p, shift), prov: byId(PROVIDERS, p.provider_id) })); const target = Money.parse(req.amount);
  const minOf = f => Math.min(...rows.map(f)); const proLev = scr ? scr.end.leverage : null;
  const head = rows.map(x => x.p.covenant_threshold && proLev !== null ? (parseFloat(x.p.covenant_threshold) - proLev) / parseFloat(x.p.covenant_threshold) : null);
  const obs = rows.map((x, i) => { const o = []; if (x.e.total === minOf(r => r.e.total)) o.push("Lowest estimated total cost"); if (x.e.year1Cash === minOf(r => r.e.year1Cash)) o.push("Lowest first-year cash cost"); if (x.e.A >= target) o.push("Covers the full amount"); else o.push(`Shortfall of ${Fmt.compact(target - x.e.A, req.currency)}`);
    if (x.p.amortization.kind === "BULLET") o.push("No scheduled amortisation"); if (head[i] !== null && head[i] === Math.max(...head.filter(h => h !== null))) o.push("Widest pro forma covenant headroom"); if (LENDERS.some(l => l.provider_id === x.prov.id)) o.push("Existing lender"); return o; });
  const R = (label, f, cls = "") => `<tr><th>${label}</th>${rows.map((x, i) => `<td class="${cls}">${f(x, i)}</td>`).join("")}</tr>`; const G = label => `<tr class="grp"><td colspan="${rows.length + 1}">${label}</td></tr>`;
  const refLabel = REFERENCE_RATES.labels.EURIBOR_3M;
  return `<div class="between wrap mb12"><div class="small muted">Common assumptions: ${esc(refLabel)} at <b>${Fmt.bp(REFERENCE_RATES.rates.EURIBOR_3M + shift)}</b> flat over the tenor${shift ? ` (assumption ${Fmt.bp(REFERENCE_RATES.rates.EURIBOR_3M)} ${shift > 0 ? "+" : MINUS} ${Math.abs(shift)} bp)` : ""}; annual amortisation at year end.</div>
  <div class="row wrap"><span class="small faint">Rate sensitivity</span>${[0, 50, 100, 200].map(s => `<a class="chip ${s === shift ? "on" : ""}" href="#/financing/${req.id}?tab=terms${s ? `&shift=${s}` : ""}">${s ? `+${s} bp` : "Base"}</a>`).join("")}<button class="btn sm" data-action="record-proposal" data-req="${req.id}">${icon("plus")}Record terms</button></div></div>
  <section class="card"><div class="tbl-wrap"><table class="t compare"><thead><tr><th></th>${rows.map(x => `<th style="color:var(--ink);font-size:13.5px"><a href="#/providers/${x.prov.id}?req=${req.id}">${esc(x.prov.name)}</a><span class="sub">${esc(PROVIDER_CATEGORIES[x.prov.category])} · received ${Fmt.date(x.p.received_at)}</span></th>`).join("")}</tr></thead><tbody>
  ${G("Offer")}${R("Instrument", x => esc(x.p.instrument))}${R("Amount", x => `<b class="tnum">${Fmt.money(x.e.A, req.currency)}</b>${x.e.A < target ? `<span class="sub" style="color:var(--crit)">${Fmt.compact(target - x.e.A, req.currency)} short of the request</span>` : '<span class="sub">covers the request</span>'}`)}
  ${R("Tenor", x => `${x.p.tenor_years} years${x.p.tenor_years !== req.tenor_years ? `<span class="sub">requested ${req.tenor_years}</span>` : ""}`)}${R("Valid until", x => x.p.valid_until ? Fmt.date(x.p.valid_until) : "—")}
  ${G("Pricing")}${R("Rate", x => x.p.rate_type === "FIXED" ? `Fixed ${Fmt.bp(x.p.fixed_rate_bp)}` : `${esc(REFERENCE_RATES.labels[x.p.reference_rate])} + ${Fmt.bp(x.p.margin_bp)}`)}${R("All-in rate under assumptions", x => `<b class="tnum">${Fmt.bp(x.e.rate)}</b>`)}${R("Upfront fee", x => `${Fmt.bp(x.p.upfront_fee_bp)} · ${Fmt.money(x.e.upfront, req.currency)}`)}${R("Recurring fees", x => x.e.recurring ? `${Fmt.money(x.e.recurring, req.currency)} per year` : "None")}
  ${G("Structure")}${R("Amortisation", x => `${esc(x.p.amortization_text)}<span class="sub">balloon ${Fmt.compact(x.e.balloon, req.currency)} · average life ${x.e.avgLife.toFixed(1)} years</span>`)}${R("Security", x => esc(x.p.security))}${R("Financial covenants", x => esc(x.p.covenants))}
  ${R("Pro forma covenant check", (x, i) => head[i] === null ? '<span class="faint">No linked scenario or numeric covenant</span>' : `${Fmt.ratio(proLev)} vs ${Fmt.ratio(x.p.covenant_threshold)} — ${badge(head[i] < 0 ? "BREACH" : head[i] < .05 ? "CRITICAL" : head[i] < .15 ? "WATCH" : "COMPLIANT", `headroom ${Fmt.pct(head[i])}`)}`)}
  ${R("Prepayment", x => esc(x.p.prepayment))}${R("Notes", x => `<span class="small muted">${esc(x.p.notes || "")}</span>`)}
  ${G("Illustrative costs")}${R("Year-1 interest", x => Fmt.money(x.e.year1Interest, req.currency), "tnum")}${R("Year-1 cash financing cost", x => `<b>${Fmt.money(x.e.year1Cash, req.currency)}</b><span class="sub">interest + upfront + recurring fees</span>`, "tnum")}
  ${R("Estimated cash cost over the tenor", x => `<b>${Fmt.money(x.e.total, req.currency)}</b>`, "tnum")}${R("Cost per year of average outstanding", x => `${Fmt.pct(x.e.allInPerYear, 2)}<span class="sub">comparable across amounts and profiles</span>`, "tnum")}

  <tr><th></th>${rows.map(x => `<td>${req.selected_proposal_id === x.p.id ? '<span class="badge b-ok"><i></i>Selected for negotiation</span>' : `<button class="btn sm ${req.selected_proposal_id ? "" : "primary"}" data-action="select-proposal" data-req="${req.id}" data-prop="${x.p.id}">Select for negotiation</button>`}</td>`).join("")}</tr>
  </tbody></table></div></section>
  <div class="grid g2 mt16"><div class="note"><b>Included in costs:</b> interest on the scheduled opening balance of each year at the stated assumptions, upfront fees and recurring fees. <b>Excluded:</b> reference-rate changes beyond the sensitivity, floors, hedging, prepayment fees, break costs, legal and advisory fees, taxes and any cost of funding a shortfall.</div>

}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (scopeOpen && !e.target.closest(".scope")) { scopeOpen = false; render(); if (!el) return; }
  if (!el) return; const a = el.dataset.action; const d = el.dataset; const st = Store.state;
  if (a === "nav") { const inner = e.target.closest("a,button,select,input,label"); if (inner && inner !== el && el.contains(inner)) return; go(d.href); return; }
  switch (a) {
    case "prov": e.preventDefault(); openProv(d.node, d.push === "1"); break;
    case "close-drawer": Store.ui({ drawer: [] }); break;
    case "close-drawer-nav": Store.ui({ drawer: [] }); break;
    case "drawer-pop": e.preventDefault(); Store.ui({ drawer: st.ui.drawer.slice(0, parseInt(d.depth, 10)) }); break;
    case "modal-bg": if (e.target === el) closeModal(); break;
    case "close-modal": closeModal(); break;
    case "confirm-ok": { const fn = pendingConfirm; pendingConfirm = null; closeModal(); if (fn) fn(); break; }
    case "toggle-nav": Store.ui({ nav: !st.ui.nav }); break;
    case "scope-toggle": scopeOpen = !scopeOpen; render(); break;
    case "scope-set": Actions.setScope(d.ids.split(",")); break;
    case "ack": Actions.ackPriority(d.id, d.title); toast("Marked as reviewed", "The priority stays visible under Reviewed."); break;
    case "prepare-refi": go(`#/financing/new?refi=${d.fin}`); break;
    case "sc-new-refi": { const f = byId(FINANCINGS, d.fin); const v = facilityView(dataset(st), f); const id = Actions.createScenario({ ...SCENARIO_SEEDS.find(s => s.type === "REFINANCING"), name: `Refinancing — ${f.label}`, entity_id: f.entity_id, refinance_financing_id: f.id, refinance_amount: Money.str(v.eur || 0), new_borrowing: Money.str(v.eur || 0), new_limit: Money.str(v.committedEur || v.eur || 0), new_rate_bp: v.rate, description: `Replace the ${f.label} (${f.external_reference}) with a new facility.` }); go(`#/scenarios/${id}`); break; }
    case "save-calc": { const cov = byId(COVENANTS, d.cov); confirmModal(`Save ${cov.short_label} at ${Fmt.date(d.date)}?`, "Saving freezes the result, every input value, the source versions and a SHA-256 fingerprint of the inputs. Later imports or adjustments will not change the saved calculation.", "Save calculation", () => Actions.saveCalculation(d.cov, d.date)); break; }
    case "edit-adj": adjustmentModal(d.key); break;
    case "restore-adj": Actions.restoreAdjustment(d.key); break;
    case "reimport": confirmModal("Import the corrected trial balance?", "Version 2 of the Lumenvale Industrie SAS trial balance at 30 Sep 2026 replaces version 1 (cash −€100,000, receivables +€100,000). Current calculations update; saved calculations remain frozen.", "Import version 2", () => Actions.reimportBalance()); break;
    case "sc-reset": Actions.resetScenario(d.id); break;
    case "sc-copy": { const sc = st.scenarios.find(s => s.id === d.id); const id = Actions.createScenario(sc); toast("Scenario duplicated"); go(`#/scenarios/${id}`); break; }
    case "sc-fix": { const sc = st.scenarios.find(s => s.id === d.id); const { B, C, D, R } = scenarioNumbers(sc); const uses = D + R;
      if (d.mode === "borrow") Actions.updateScenario(d.id, { new_borrowing: Money.str(Math.max(0, uses - C)), new_limit: Money.str(Math.max(Money.parse(sc.new_limit) || 0, uses - C)) }); else Actions.updateScenario(d.id, { cash_contribution: Money.str(Math.max(0, uses - B)) }); break; }
    case "sc-to-request": scenarioToRequest(d.id); break;
    case "stage": Actions.setStage(d.id, d.stage); break;
    case "shortlist": Actions.shortlist(d.req, d.prov, d.add === "1"); break;
    case "select-proposal": { const p = st.proposals.find(x => x.id === d.prop); const prov = byId(PROVIDERS, p.provider_id); confirmModal(`Select ${prov.name} for negotiation?`, `This records your choice and moves the request to "Selected for negotiation". It does not accept an offer, does not commit the provider, and does not add any debt to the register or the capital structure.`, "Select for negotiation", () => Actions.selectProposal(d.req, d.prop)); break; }
    case "record-proposal": proposalModal(d.req); break;
    case "brief": briefModal(d.req); break;
    case "brief-download": downloadBrief(d.req); break;
    case "brief-print": { const fr = $("brief-frame"); if (fr && fr.contentWindow) { fr.contentWindow.focus(); fr.contentWindow.print(); Actions.logExport(d.req); } break; }
    case "share-preview": shareModal(d.req); break;
    case "reset-demo": confirmModal("Reset the demo?", "All changes — saved calculations, adjustments, imports, scenarios, requests, shortlists and selections — are discarded and the initial fictional dataset is restored.", "Reset the demo", () => { Actions.resetDemo(); go("#/"); }, true); break;
    case "reload": location.reload(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (Store.state.ui.modal) closeModal(); else if (Store.state.ui.drawer.length) Store.ui({ drawer: [] }); else if (scopeOpen) { scopeOpen = false; render(); } }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-action]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => { const el = e.target; if (el.type === "range" && el.dataset.fmt) { const out = $(`${el.id}-out`); if (out) out.textContent = RANGE_FMT[el.dataset.fmt](parseInt(el.value, 10)); } });
document.addEventListener("change", e => {
  const el = e.target; const d = el.dataset;
  if (d.action === "scope-entity") { const ids = [...document.querySelectorAll('.scope-pop input[type=checkbox]')].filter(x => x.checked).map(x => x.value); if (ids.length) Actions.setScope(ids); return; }
  switch (d.change) {
    case "nav-query": { const q = { ...parseRoute().query, [d.key]: el.value }; Object.keys(q).forEach(k => !q[k] && delete q[k]); const s = new URLSearchParams(q).toString(); go(`${d.base}${s ? "?" + s : ""}`); break; }
    case "sc-field": {
      const sc = Store.state.scenarios.find(s => s.id === d.id); let v = el.value; const f = d.field;
      if (d.kind === "money") { const c = parseAmount(v); if (c === null) { toast("Enter an amount in euros, e.g. 2,500,000"); render(); return; } v = Money.str(c); }
      else if (d.kind === "rate") { const n = parseFloat(String(v).replace(",", ".")); if (!isFinite(n) || n < 0 || n > 30) { toast("Enter a rate between 0 and 30%"); render(); return; } v = Math.round(n * 100); }
      else if (d.kind === "int") { const n = parseInt(v, 10); if (!isFinite(n) || n < 1 || n > 30) { toast("Enter a tenor between 1 and 30 years"); render(); return; } v = n; }
      else if (d.kind === "range") v = parseInt(v, 10);
      else if (d.kind === "select") v = f === "horizon_months" ? parseInt(v, 10) : v || null;
      else if (d.kind === "str") { v = v.trim(); if (!v) { render(); return; } }
      const patch = { [f]: v };
      if (f === "refinance_financing_id" && v) { const fv = facilityView(dataset(Store.state), byId(FINANCINGS, v)); patch.refinance_amount = Money.str(fv.eur || 0); patch.entity_id = fv.f.entity_id; if (!Money.parse(sc.new_borrowing)) patch.new_borrowing = Money.str(fv.eur || 0); }
      Actions.updateScenario(d.id, patch); break;
    }
    case "check-status": Actions.setChecklist(d.req, d.key, el.value); toast("Checklist updated"); break;
    case "req-field": { const v = el.value.trim(); if (!v) { render(); return; } Actions.updateRequest(d.id, { [d.field]: v }, { action: "REQUEST_UPDATED", details: [[d.field === "next_action" ? "Next action" : "Owner", d.field === "owner_id" ? userName(v) : v]] }); toast("Request updated"); break; }
  }
});
document.addEventListener("submit", e => {
  const f = e.target; if (!f.dataset || !f.dataset.form) return; e.preventDefault(); const fd = Object.fromEntries(new FormData(f)); const errs = [];
  const showErr = () => { const box = f.querySelector("#form-errors"); if (box) box.innerHTML = errs.length ? `<div class="note crit mb12" role="alert"><b>Please correct the following:</b><ul style="margin:6px 0 0;padding-left:18px">${errs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""; };
  if (f.dataset.form === "new-request") {
    const amt = parseAmount(fd.amount); const tenor = parseInt(fd.tenor_years, 10);
    if (!fd.entity_id) errs.push("Choose a borrowing entity."); if (!amt || amt <= 0) errs.push("Enter an amount greater than zero (digits, optional comma separators)."); if (!(tenor >= 1 && tenor <= 30)) errs.push("Enter a tenor between 1 and 30 years.");
    if (!fd.target_date || fd.target_date < DEMO.today) errs.push(`Choose a target closing date on or after ${Fmt.date(DEMO.today)}.`); if (fd.purpose === "REFINANCING" && !fd.refinance_financing_id) errs.push("Select the existing facility to refinance.");
    if (errs.length) return showErr();
    const ent = entityOf(fd.entity_id); const sc = fd.scenario_id ? Store.state.scenarios.find(s => s.id === fd.scenario_id) : null; const refi = fd.refinance_financing_id ? byId(FINANCINGS, fd.refinance_financing_id) : null;
    const docs = [...new Set([...(refi ? refi.document_ids : FINANCINGS.filter(x => x.entity_id === ent.id).flatMap(x => x.document_ids.slice(0, 1))), "doc-08", "doc-09"])];
    const id = Actions.createRequest({ title: fd.title.trim() || `${PURPOSES[fd.purpose]} — ${ent.short_name}`, entity_id: ent.id, purpose: fd.purpose, amount: Money.str(amt), currency: fd.currency, instrument: fd.instrument, tenor_years: tenor, target_date: fd.target_date,
      refinance_financing_id: refi ? refi.id : null, rationale: fd.rationale.trim(), scenario_id: sc ? sc.id : null, scenario_snapshot: sc ? clone(sc) : null, linked_documents: docs });
    toast("Financing request created", "Added to the workspace as a draft."); go(`#/financing/${id}`); return;
  }
  if (f.dataset.form === "adj-form") {
    const amt = parseAmount(fd.amount); if (amt === null) errs.push("Enter a valid amount (zero or more)."); if (!fd.justification || fd.justification.trim().length < 10) errs.push("Enter a justification of at least 10 characters.");
    if (errs.length) return showErr(); closeModal(); Actions.commitAdjustment(f.dataset.key, Money.str(amt), fd.justification.trim()); return;
  }
  if (f.dataset.form === "proposal-form") {
    const amt = parseAmount(fd.amount); const tenor = parseInt(fd.tenor_years, 10); const rate = parseFloat(String(fd.rate).replace(",", ".")); const up = parseFloat(String(fd.upfront).replace(",", ".")); const rec = parseAmount(fd.recurring || "0"); const ap = parseFloat(String(fd.amort_pct).replace(",", ".")); const ct = fd.covenant_threshold ? parseFloat(String(fd.covenant_threshold).replace(",", ".")) : null;
    if (!amt) errs.push("Enter the proposed amount."); if (!(tenor >= 1 && tenor <= 30)) errs.push("Enter a tenor between 1 and 30 years."); if (!(rate >= 0 && rate <= 30)) errs.push("Enter a margin or fixed rate between 0 and 30%."); if (!(up >= 0 && up <= 10)) errs.push("Enter an upfront fee between 0 and 10%.");
    if (rec === null) errs.push("Enter recurring fees as an amount (0 if none)."); if (fd.amort === "LINEAR_PCT" && !(ap > 0 && ap <= 100)) errs.push("Enter an amortisation percentage between 0 and 100."); if (ct !== null && !(ct > 0 && ct < 20)) errs.push("Enter the covenant threshold as a multiple, e.g. 3.50.");
    if (errs.length) return showErr();
    const floating = fd.rate_type === "FLOATING";
    closeModal(); Actions.recordProposal(f.dataset.req, { provider_id: fd.provider_id, instrument: fd.instrument || "Term loan", amount: Money.str(amt), tenor_years: tenor, rate_type: fd.rate_type, reference_rate: floating ? fd.reference_rate : null, margin_bp: floating ? Math.round(rate * 100) : null, fixed_rate_bp: floating ? null : Math.round(rate * 100),
      upfront_fee_bp: Math.round(up * 100), recurring_fee: Money.str(rec), amortization: fd.amort === "BULLET" ? { kind: "BULLET" } : { kind: "LINEAR_PCT", pct: ap }, amortization_text: fd.amort === "BULLET" ? "Bullet repayment at maturity" : `${ap}% of the initial amount per year, balance at maturity`,
      covenants: fd.covenants || "Not specified", covenant_threshold: ct !== null ? ct.toFixed(2) : null, security: fd.security || "To be confirmed", prepayment: fd.prepayment || "To be confirmed" });
  }
});
function scenarioToRequest(scId) {
  const st = Store.state; const sc = st.scenarios.find(s => s.id === scId); const ent = entityOf(sc.entity_id); if (!ent) return toast("Choose the acting entity first");
  const r = runScenario(dataset(st), sc); const refi = sc.refinance_financing_id ? byId(FINANCINGS, sc.refinance_financing_id) : null;
  const purpose = { ACQUISITION: "ACQUISITION", REFINANCING: "REFINANCING", INVESTMENT: "INVESTMENT" }[sc.type] || "GENERAL";
  const instrument = sc.type === "ACQUISITION" ? "ACQUISITION_FINANCE" : sc.type === "INVESTMENT" ? "ASSET_FINANCE" : refi && refi.instrument === "RCF" ? "RCF" : "TERM_LOAN";
  const amount = sc.type === "REFINANCING" ? Math.max(r.numbers.L, r.numbers.B) : r.numbers.B; if (!amount) return toast("The scenario has no new financing to request");
  const target = refi && DateX.addMonths(refi.maturity_date, -3) > DEMO.today ? DateX.addMonths(refi.maturity_date, -3) : DateX.addMonths(DEMO.asOf, 6);
  const docs = [...new Set([...(refi ? refi.document_ids : []), ...DOCUMENTS.filter(x => x.entity_id === ent.id && x.document_type === "TRANSACTION").map(x => x.id), "doc-08", "doc-09"])];
  const id = Actions.createRequest({ title: `${PURPOSES[purpose]} — ${sc.name}`, entity_id: ent.id, purpose, amount: Money.str(amount), currency: "EUR", instrument, tenor_years: sc.new_tenor_years, target_date: target, refinance_financing_id: refi ? refi.id : null,
    rationale: `${sc.description} Prepared from the scenario "${sc.name}": new borrowing ${Fmt.money(r.numbers.B)} at an assumed ${Fmt.bp(sc.new_rate_bp)} (${sc.new_rate_type === "FIXED" ? "fixed" : "floating"}), ${sc.new_tenor_years}-year tenor${r.numbers.D ? `, transaction amount ${Fmt.money(r.numbers.D)}` : ""}${r.numbers.C ? `, cash contribution ${Fmt.money(r.numbers.C)}` : ""}${r.numbers.L > r.numbers.B ? `, commitment ${Fmt.money(r.numbers.L)}` : ""}. Pro forma group net debt / EBITDA ${Fmt.ratio(r.end.leverage)}.`,
    scenario_id: sc.id, scenario_snapshot: clone(sc), linked_documents: docs }, { fromScenario: sc.name });
  toast("Financing request created from the scenario", "Amount, entity, tenor and assumptions were carried over."); go(`#/financing/${id}`);
}

/* ---------- boot ---------- */
window.addEventListener("hashchange", () => { const r = parseRoute(); const changedPage = r.path !== lastRoute; lastRoute = r.path; scopeOpen = false; Store.state = { ...Store.state, ui: { ...Store.state.ui, drawer: [], nav: false, modal: null } }; render(); if (changedPage) { window.scrollTo(0, 0); } });

function boot() {
  Store.init(); Store.listeners.push(onStore); lastRoute = parseRoute().path; render();
  if (!Store.state.ui.storageAvailable) toast("Local storage is unavailable", "The demo works, but changes will be lost when the page closes.");
}
window.Covenn = { Store, Actions, dataset, positions, runScenario, runCovenant, BASE };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
